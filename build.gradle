plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'application'
    id 'jacoco'
}

application {
    mainClass = 'seedu.address.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

checkstyle {
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()
    // Bound the worker process as well as individual JavaFX waits in case native startup stalls.
    timeout = Duration.ofMinutes(5)
    finalizedBy jacocoTestReport
    testLogging {
        exceptionFormat = 'full'
    }
}

task coverage(type: JacocoReport) {
    dependsOn test
    sourceDirectories.from files(sourceSets.main.allSource.srcDirs)
    classDirectories.from files(sourceSets.main.output)
    executionData.from files(jacocoTestReport.executionData)
    afterEvaluate {
        classDirectories.from files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/*.jar'])
        })
    }
    reports {
        html.required = true
        xml.required = true
    }
}

// Match the Mac libraries to the JVM architecture, including Intel Java running under Rosetta.
// Release builds can select either Mac architecture with -PjavafxMacPlatform=mac or mac-aarch64.
String javaFxMacPlatform = providers.gradleProperty('javafxMacPlatform').getOrElse(
        System.getProperty('os.name').startsWith('Mac')
                && ['aarch64', 'arm64'].contains(System.getProperty('os.arch').toLowerCase(Locale.ROOT))
                ? 'mac-aarch64' : 'mac')
if (!(javaFxMacPlatform in ['mac', 'mac-aarch64'])) {
    throw new GradleException('javafxMacPlatform must be mac or mac-aarch64.')
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        ['win', javaFxMacPlatform, 'linux'].each { platform ->
            implementation("org.openjfx:javafx-${module}:${javaFxVersion}:${platform}") {
                // All required modules are explicit; their POMs must not add a second Mac architecture.
                transitive = false
            }
        }
    }

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.7.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

shadowJar {
    // Intel and ARM Mac libraries have identical resource names and cannot share one fat JAR.
    archiveFileName = javaFxMacPlatform == 'mac-aarch64'
            ? 'teach-assist-v1.6-mac-aarch64.jar' : 'teach-assist-v1.6.jar'
}

run {
    enableAssertions = true
}

defaultTasks 'clean', 'test'
